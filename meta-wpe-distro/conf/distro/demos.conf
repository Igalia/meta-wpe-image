require conf/distro/moonforge.conf

DISTRO = "demos"
DISTRO_NAME = "Igalia Demos Distro based on Moonforge Linux"
DISTRO_VERSION = "2.0"

MAINTAINER = "Pablo Saavedra <psaavedra@igalia.com>"

DISTRO_FEATURES:remove = "ptest"

# Vulkan stack (vulkan-loader/mesa-vulkan-drivers gate on this via features_check)
DISTRO_FEATURES:append = " vulkan"

# GStreamer Video decoder v4l2h264dec (by default):
PACKAGECONFIG:append:pn-gstreamer1.0-plugins-bad = " v4l2codecs"

PACKAGECONFIG:append:pn-qemu-native = " sdl"
PACKAGECONFIG:append:pn-nativesdk-qemu = " sdl"

# SDK / toolchain extras (centralized here from image_demos.bbclass)
SDK_EXTRA_TOOLS += "nativesdk-cmake nativesdk-ninja \
    nativesdk-perl-module-findbin \
    nativesdk-perl-misc \
    nativesdk-gperf \
    nativesdk-unifdef \
    "

TOOLCHAIN_HOST_TASK:append = " ${SDK_EXTRA_TOOLS}"
TOOLCHAIN_TARGET_TASK:append = " openjpeg-staticdev"
TOOLCHAIN_TARGET_TASK:append = " libjxl"
TOOLCHAIN_TARGET_TASK:remove = "target-sdk-provides-dummy"

# Per-machine SRCREV locks, opt-in via the "reproducible" DISTRO_FEATURE. Kept out
# of a kas local_conf_header because the preset expands ${MACHINE}, and kas writes
# MACHINE at the end of local.conf - after every header block, so an include from
# there sees an empty machine. DISTRO_FEATURES is read at this point in the parse,
# so enable the feature from local.conf or a kas local_conf_header (both parsed
# earlier), not from anything that lands after the distro conf. Leaving it off is
# what lets .github/actions/buildhistory-collect-srcrevs resolve real upstream
# revisions instead of echoing the existing pins straight back.
REPRODUCIBLE_CORE_LOCK = "conf/include/srcrev_core-image-weston-wpe_${MACHINE}.inc"

# Warn rather than silently building unpinned: machines with no lock file (currently
# raspberrypi3 and raspberrypi4-64) would otherwise sail through a bare include and
# report themselves as reproducible while pinning nothing. The DISTRO_FEATURES test
# is the outer conditional on purpose - bb.utils.contains evaluates its arguments
# eagerly, so a warning nested inside it would fire even with the feature off.
# bb.warn returns None, hence the trailing or ''.
include ${@(d.getVar('REPRODUCIBLE_CORE_LOCK') if bb.utils.which(d.getVar('BBPATH'), d.getVar('REPRODUCIBLE_CORE_LOCK')) else (bb.warn("reproducible-core is enabled but %s does not exist: MACHINE=%s is NOT pinned" % (d.getVar('REPRODUCIBLE_CORE_LOCK'), d.getVar('MACHINE'))) or '')) if bb.utils.contains('DISTRO_FEATURES', 'reproducible-core', True, False, d) else ''}

require ${@bb.utils.contains('DISTRO_FEATURES', 'reproducible-webkit', "conf/include/srcrev_webkit.inc", '', d)}
