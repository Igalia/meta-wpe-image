# Required by the read-only-rootfs + overlayfs-etc image feature: /etc is
# mounted as an overlay at early boot. The fsl-community imx_v6_v7_defconfig
# does not enable overlayfs, so without this the /etc overlay never mounts and
# the rootfs stays read-only (breaks e.g. sshd host-key generation).
CONFIG_OVERLAY_FS=y
