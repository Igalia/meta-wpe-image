# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "wpebackport"
BBFILE_PATTERN_wpebackport := "^${LAYERDIR}/"
BBFILE_PRIORITY_wpebackport = "10"

LAYERSERIES_COMPAT_wpebackport = "scarthgap"
