header:
  version: 11

distro: moonforge

target: core-image-weston-wpe

local_conf_header:
  99_distro: |
    DISTRO_FEATURES:remove = "ptest"
    # GStreamer Video decoder v4l2h264dec (by default):
    PACKAGECONFIG:append:pn-gstreamer1.0-plugins-bad = " v4l2codecs"
    # eeprom for Raspberrypi boards
    IMAGE_INSTALL:append:raspberrypi4 = " rpi-eeprom"
    IMAGE_INSTALL:append:raspberrypi4-64 = " rpi-eeprom"
    IMAGE_INSTALL:append:raspberrypi5 = " rpi-eeprom"

